<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Eden's Roma</title>

  <!-- FONTS: Korolev and Cesso are not on Google Fonts.
       Paste your Adobe Fonts stylesheet link here, for example:
       <link rel="stylesheet" href="https://use.typekit.net/YOUR-KIT-ID.css"> -->

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <a href="index.html">
      <img class="apple" src="images/apple.png" alt="Eden's Roma apple">
    </a>
    <img class="logo" src="images/logo.png" alt="Eden's Roma">
    <div class="header-spacer"></div>
  </header>

  <main>

    <!-- Banner: replace the text with an img tag once you have your photo,
         for example: <img class="banner-photo" src="images/banner.jpg" alt="..."> -->
    <section class="banner">
      <p class="banner-text">Insert Photo</p>
    </section>

    <section class="tagline">
      <img class="string" src="images/bottom-string.svg" alt="">
      <h1 class="tagline-text">Your path to finding the right one</h1>
      <img class="string" src="images/top-string.svg" alt="">
    </section>

    <section class="recent">
      <h2 class="recent-title">Our Most Recent Matches</h2>

      <div class="recent-pattern">

        <!-- Left column -->
        <div class="left-column">
          <div class="card-row first-row">
            <article class="card-full">
              <img class="photo photo-full" src="images/lumin.jpg" alt="Lumin Khan">
              <p class="card-name">Lumin Khan</p>
            </article>
            <article class="card-full">
              <img class="photo photo-full" src="images/cronan.jpg" alt="Cronan Chen">
              <p class="card-name">Cronan Chen</p>
            </article>
          </div>

          <div class="card-row bottom-row">
            <article class="card-peek">
              <img class="photo photo-peek" src="images/couple-1.jpg" alt="Match">
            </article>
            <article class="card-peek">
              <img class="photo photo-peek" src="images/couple-2.jpg" alt="Match">
            </article>
          </div>
        </div>

        <!-- Right column -->
        <div class="right-column">
          <div class="card-row">
            <article class="card-hanging">
              <img class="photo photo-hanging" src="images/ash.jpg" alt="Ash Renn">
              <p class="card-name">Ash Renn</p>
            </article>
            <article class="card-hanging">
              <img class="photo photo-hanging" src="images/liam.jpg" alt="Liam Astell">
              <p class="card-name">Liam Astell</p>
            </article>
          </div>

          <div class="card-row second-row">
            <article class="card-full">
              <img class="photo photo-full" src="images/gray.jpg" alt="Gray Argol">
              <p class="card-name">Gray Argol</p>
            </article>
            <article class="card-full">
              <img class="photo photo-full" src="images/harper.jpg" alt="Harper Joan">
              <p class="card-name">Harper Joan</p>
            </article>
          </div>
        </div>

      </div>
    </section>

  </main>

</body>
</html>
