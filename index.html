<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eden's Roma | Helping you find the one</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header: logo + apple menu button -->
  <header class="site-header">
    <a class="logo" href="index.html">
      <img src="images/logo.png" alt="Eden's Roma">
    </a>
    <a class="menu-button" href="#" aria-label="Open menu">
      <img src="images/apple-menu.png" alt="">
    </a>
  </header>

  <main>
    <!-- Hero banner -->
    <section class="hero" aria-label="Welcome">
      <span class="rule rule--top" aria-hidden="true"></span>
      <img class="hero-img" src="images/cover-photo.png"
           alt="Helping you find the one. We exist for you. A couple touches foreheads, holding a bouquet.">
      <span class="rule rule--bottom" aria-hidden="true"></span>
    </section>

    <p class="tagline">It&rsquo;s all about finding your perfect half</p>

    <img class="string" src="images/top-string.svg" alt="" aria-hidden="true">

    <!-- Recent matches -->
    <section class="matches" aria-labelledby="matches-title">
      <h2 id="matches-title">Our Most Recent Matches</h2>

      <div class="matches-field">
        <ul class="matches-stage">

          <!-- Full cards -->
          <li class="card card--full card--lumin">
            <img class="card-photo" src="images/lumin-khan.png" alt="Portrait of Lumin Khan">
            <p class="card-name">Lumin Khan</p>
          </li>

          <li class="card card--full card--cronan">
            <img class="card-photo" src="images/cronan-chen.png" alt="Portrait of Cronan Chen">
            <p class="card-name">Cronan Chen</p>
          </li>

          <li class="card card--full card--gray">
            <img class="card-photo" src="images/gray-argol.png" alt="Portrait of Gray Argol">
            <p class="card-name">Gray Argol</p>
          </li>

          <li class="card card--full card--harper">
            <img class="card-photo" src="images/harper-joan.png" alt="Portrait of Harper Joan">
            <p class="card-name">Harper Joan</p>
          </li>

          <!-- Cards peeking in from the top edge -->
          <li class="card card--top card--ash">
            <img class="card-photo" src="images/ash-renn.png" alt="Portrait of Ash Renn">
            <p class="card-name">Ash Renn</p>
          </li>

          <li class="card card--top card--liam">
            <img class="card-photo" src="images/liam-astell.png" alt="Portrait of Liam Astell">
            <p class="card-name">Liam Astell</p>
          </li>

          <!-- Cards peeking in from the bottom edge -->
          <li class="card card--bottom card--bottom-left">
            <img class="card-photo" src="images/match-bottom-left.png" alt="Portrait of a recent match">
          </li>

          <li class="card card--bottom card--bottom-right">
            <img class="card-photo" src="images/match-bottom-right.png" alt="Portrait of a recent match">
          </li>

        </ul>
      </div>
    </section>
  </main>

  <footer class="site-footer"></footer>

</body>
</html>
