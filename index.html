<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eden's Roma | Helping you find the one</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header: logo + apple menu button -->
  <header class="site-header">
    <a class="logo" href="index.html">
      <img src="images/logo.png" alt="Eden's Roma">
    </a>
    <a class="menu-button" href="#" aria-label="Open menu">
      <img src="images/apple-menu.png" alt="">
    </a>
  </header>

  <main>
    <!-- Hero banner -->
    <section class="hero" aria-label="Welcome">
      <span class="rule rule--top" aria-hidden="true"></span>
      <img class="hero-img" src="images/cover-photo.png"
           alt="Helping you find the one. We exist for you. A couple touches foreheads, holding a bouquet.">
      <span class="rule rule--bottom" aria-hidden="true"></span>
    </section>

    <p class="tagline">It&rsquo;s all about finding your perfect half</p>

    <img class="string" src="images/top-string.svg" alt="" aria-hidden="true">

    <!-- Recent matches -->
    <section class="matches" aria-labelledby="matches-title">
      <h2 id="matches-title">Our Most Recent Matches</h2>

      <div class="matches-field">
        <div class="matches-stage">
    <!-- Left elevator: Lumin & Cronan, Hailey & Ashley -->
    <div class="column column--left">
      <div class="couple couple--pink">
        <figure class="card">
          <img class="card-photo" src="images/hailey-stone.png" alt="Portrait of Hailey Stone">
          <figcaption class="card-name">Hailey Stone</figcaption>
        </figure>
        <figure class="card">
          <img class="card-photo" src="images/ashley-williams.png" alt="Portrait of Ashley Williams">
          <figcaption class="card-name">Ashley Williams</figcaption>
        </figure>
      </div>
      <div class="couple couple--green">
        <figure class="card">
          <img class="card-photo" src="images/lumin-khan.png" alt="Portrait of Lumin Khan">
          <figcaption class="card-name">Lumin Khan</figcaption>
        </figure>
        <figure class="card">
          <img class="card-photo" src="images/cronan-chen.png" alt="Portrait of Cronan Chen">
          <figcaption class="card-name">Cronan Chen</figcaption>
        </figure>
      </div>
      <div class="couple couple--pink" aria-hidden="true">
        <figure class="card">
          <img class="card-photo" src="images/hailey-stone.png" alt="">
          <figcaption class="card-name">Hailey Stone</figcaption>
        </figure>
        <figure class="card">
          <img class="card-photo" src="images/ashley-williams.png" alt="">
          <figcaption class="card-name">Ashley Williams</figcaption>
        </figure>
      </div>
      <div class="couple couple--green" aria-hidden="true">
        <figure class="card">
          <img class="card-photo" src="images/lumin-khan.png" alt="">
          <figcaption class="card-name">Lumin Khan</figcaption>
        </figure>
        <figure class="card">
          <img class="card-photo" src="images/cronan-chen.png" alt="">
          <figcaption class="card-name">Cronan Chen</figcaption>
        </figure>
      </div>
    </div>

    <!-- Right elevator: Gray & Harper, Ash & Liam -->
    <div class="column column--right">
      <div class="couple couple--green">
        <figure class="card">
          <img class="card-photo" src="images/gray-argol.png" alt="Portrait of Gray Argol">
          <figcaption class="card-name">Gray Argol</figcaption>
        </figure>
        <figure class="card">
          <img class="card-photo" src="images/harper-joan.png" alt="Portrait of Harper Joan">
          <figcaption class="card-name">Harper Joan</figcaption>
        </figure>
      </div>
      <div class="couple couple--pink">
        <figure class="card">
          <img class="card-photo" src="images/ash-renn.png" alt="Portrait of Ash Renn">
          <figcaption class="card-name">Ash Renn</figcaption>
        </figure>
        <figure class="card">
          <img class="card-photo" src="images/liam-astell.png" alt="Portrait of Liam Astell">
          <figcaption class="card-name">Liam Astell</figcaption>
        </figure>
      </div>
      <div class="couple couple--green" aria-hidden="true">
        <figure class="card">
          <img class="card-photo" src="images/gray-argol.png" alt="">
          <figcaption class="card-name">Gray Argol</figcaption>
        </figure>
        <figure class="card">
          <img class="card-photo" src="images/harper-joan.png" alt="">
          <figcaption class="card-name">Harper Joan</figcaption>
        </figure>
      </div>
      <div class="couple couple--pink" aria-hidden="true">
        <figure class="card">
          <img class="card-photo" src="images/ash-renn.png" alt="">
          <figcaption class="card-name">Ash Renn</figcaption>
        </figure>
        <figure class="card">
          <img class="card-photo" src="images/liam-astell.png" alt="">
          <figcaption class="card-name">Liam Astell</figcaption>
        </figure>
      </div>
    </div>
  </div>
      </div>
    </section>
  </main>

  <footer class="site-footer"></footer>

</body>
</html>
